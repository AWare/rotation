name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Previously this also fired on `pull_request: closed`, so merging a PR started
# two runs that raced to create the same tag. Serialise releases and never
# cancel one midway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # Robolectric fetches its android-all runtimes into ~/.m2 at test time.
      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      # Do not publish something that does not pass its own tests.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Releases must be signed with a" \
                 "stable key: Android rejects an update whose signing certificate" \
                 "differs from the installed one. See README.md > Signing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          # Monotonic, and unlike a git commit count it survives shallow clones.
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the APK is signed with the release key
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          [ -n "$apk" ] || { echo "::error::no release APK produced"; exit 1; }
          "$apksigner" verify --print-certs "$apk"
          if "$apksigner" verify --print-certs "$apk" | grep -q 'CN=Android Debug'; then
            echo "::error::APK is signed with a debug certificate. That key is" \
                 "generated per machine, so every release would have a different" \
                 "signature and updates would be rejected."
            exit 1
          fi

      # Read the version from Gradle rather than grepping build.gradle.kts: the
      # old `grep versionName` also matched versionNameSuffix and produced a
      # multi-line value, which silently truncated the tag to "v1.0".
      - name: Get version
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew -q printVersion > version.txt
          cat version.txt
          grep -E '^version(Name|Code)=' version.txt >> "$GITHUB_OUTPUT"
          echo "tag=v$(grep '^versionName=' version.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.versionName }}
          body: |
            ## ⚠️ WARNING: Vibe-Coded Software

            This app is vibe-coded and not intended for production use.

            **Version:** ${{ steps.version.outputs.versionName }} (build ${{ steps.version.outputs.versionCode }})
            **Minimum Android:** 10 (API 29)
            **Target Android:** 17 (API 37)
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
