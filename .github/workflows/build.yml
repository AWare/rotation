name: Build and Test

on:
  push:
    # Every branch, not a hand-maintained list. '**' matches branches only, so
    # tag pushes do not double-build.
    branches: [ '**' ]
  pull_request:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # GitHub's implicit shell is `bash -e`, which has no pipefail: any step that
    # pipes gradle into another command (tee, grep) reports the *pipe's* exit
    # code and passes even when the build failed. `shell: bash` is
    # `bash --noprofile --norc -eo pipefail`, so failures actually fail.
    shell: bash

jobs:
  check:
    name: Test, lint and build
    runs-on: ubuntu-latest
    # A push already covers same-repo branches; this stops same-repo PRs
    # building the identical commit twice while still covering fork PRs.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    # Without this a wedged build occupies a runner for six hours.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Refuses to run if gradle-wrapper.jar is not a known-good release.
          validate-wrappers: true

      # Robolectric downloads its android-all runtimes into ~/.m2 at *test*
      # time, which setup-gradle does not cache. Without this every run pulls
      # ~300MB from Maven mid-test, which is both slow and a live network
      # dependency in the middle of the test phase.
      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      # Each of these fails the job on its own. They are separate steps so the
      # Actions UI names the stage that broke rather than one opaque "gradle".
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK was produced
        run: |
          count=$(find app/build/outputs/apk/debug -name '*.apk' -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::assembleDebug succeeded but produced no APK"
            exit 1
          fi
          echo "Found $count APK(s)"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
